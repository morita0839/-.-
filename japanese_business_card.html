<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本語名刺メーカー</title>
<style>
body{margin:0;background:#f2f2f2;font-family:Arial,"Noto Sans JP",sans-serif;color:#222;padding:30px}
.wrap{max-width:1000px;margin:auto;display:grid;grid-template-columns:1fr 1.2fr;gap:30px}
.panel,.card{background:white;border-radius:16px;box-shadow:0 10px 30px #0001}
.panel{padding:25px} h1{margin-top:0}
label{display:block;margin:14px 0 5px;font-weight:bold}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;box-sizing:border-box;font-size:15px}
textarea{height:70px}
.preview{display:flex;align-items:center;justify-content:center}
.card{width:90%;aspect-ratio:1.75/1;padding:38px;box-sizing:border-box;position:relative;border-left:8px solid #222}
.company{font-size:14px;letter-spacing:2px;color:#666;margin-bottom:30px}
.name{font-size:32px;font-weight:bold}.kana{font-size:13px;color:#777;margin:5px 0 25px}
.position{margin-bottom:20px}.contact{font-size:13px;line-height:1.8}
.mark{position:absolute;right:25px;bottom:18px;color:#aaa;font-size:11px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.card{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<h1>🇯🇵 日本語名刺メーカー</h1>
<p>入力した内容が右側の名刺にリアルタイムで反映されます。</p>
<label>会社名・所属</label><input id="company" value="東京国際株式会社">
<label>氏名</label><input id="name" value="金 在潤">
<label>フリガナ</label><input id="kana" value="キム・ジェユン">
<label>役職</label><input id="position" value="学生・国際交流担当">
<label>電話番号</label><input id="phone" value="03-1234-5678">
<label>メール</label><input id="email" value="example@example.com">
<label>住所</label><textarea id="address">東京都新宿区西新宿1-1-1</textarea>
</section>
<section class="preview">
<div class="card">
<div class="company" id="oCompany"></div>
<div class="name" id="oName"></div>
<div class="kana" id="oKana"></div>
<div class="position" id="oPosition"></div>
<div class="contact">TEL　<span id="oPhone"></span><br>MAIL　<span id="oEmail"></span><br><span id="oAddress"></span></div>
<div class="mark">名刺 / MEISHI</div>
</div>
</section>
</div>
<script>
const ids=["company","name","kana","position","phone","email","address"];
function update(){
ids.forEach(x=>document.getElementById("o"+x[0].toUpperCase()+x.slice(1)).textContent=document.getElementById(x).value);
}
ids.forEach(x=>document.getElementById(x).addEventListener("input",update)); update();
</script>
</body>
</html>
